apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.seoin.englishstudy"
    compileSdk 35

    defaultConfig {
        applicationId "com.seoin.englishstudy"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    androidResources {
        noCompress += "mp3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.9.1"
}
