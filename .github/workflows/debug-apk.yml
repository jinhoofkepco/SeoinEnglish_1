name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/update-study-flow

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug
          mkdir -p build/artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build/artifacts/seoin-english-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: seoin-english-debug.apk
          path: build/artifacts/seoin-english-debug.apk
          archive: false
          retention-days: 1
